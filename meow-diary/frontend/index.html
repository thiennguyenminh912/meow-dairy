<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!--
      KHÔNG khai interactive-widget: để mặc định `resizes-visual`.
      `resizes-content` co luôn layout viewport khi bàn phím ảo bật lên — chính
      là thứ làm cuốn sổ bị bóp lại còn tí xíu lúc đang gõ. Với mặc định thì
      window.innerHeight đứng yên, chỉ visualViewport co, nên đo được chiều cao
      bàn phím và tự quyết định nâng cuốn sổ lên bao nhiêu.
      maximum-scale/user-scalable: Android tôn trọng, iOS bỏ qua (chặn bằng JS).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Meow Diary — nhật ký của tớ</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f2d3a0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meow Diary" />
    <meta name="description" content="Cuốn nhật ký giấy giả lập: lật trang, viết, vẽ, dán sticker cùng một bạn mèo." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playpen+Sans:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
